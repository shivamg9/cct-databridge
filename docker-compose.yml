# Local demo stack: http://localhost:8080 (console) and http://localhost:8080/api/v1 (API).
#   docker compose up --build -d     start
#   docker compose logs -f           follow logs
#   docker compose down              stop (records are kept in the named volume)
name: cct-databridge

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: cct-databridge-backend:local
    environment:
      # Fixed here so .env cannot switch it: integration mode is never enabled automatically.
      DATABRIDGE_MODE: demo
      HOST: 0.0.0.0
      PORT: "8080"
      DATABRIDGE_DATA_FILE: /data/demo-records.json
      DATABRIDGE_API_KEY: ${DATABRIDGE_API_KEY:?Set DATABRIDGE_API_KEY in .env (see .env.example)}
      # Demo only: pull returns the stored synthetic values. Set it to false in .env for masked pulls.
      # The server refuses to start if this is true in integration mode.
      DATABRIDGE_UNMASKED_PULL: ${DATABRIDGE_UNMASKED_PULL:-true}
      # DATABRIDGE_FULL_ACCESS_KEY is deliberately not passed.
      # Fixed off, so this stack can never send to the real NSR. To try the NSR workflow against a local
      # mock, add the override: docker compose -f docker-compose.yml -f docker-compose.nsr-mock.yml up -d
      NSR_WEBHOOK_ENABLED: "false"
    volumes:
      - databridge-data:/data
    expose:
      - "8080"            # reachable only from the frontend on the compose network; no host port
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    image: cct-databridge-frontend:local
    ports:
      - "127.0.0.1:8080:8080"   # localhost only
    depends_on:
      backend:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    restart: unless-stopped

volumes:
  databridge-data:
