apiVersion: apps/v1
kind: Deployment
metadata:
  name: databridge-frontend
  namespace: cct-databridge
  labels: { app.kubernetes.io/name: cct-databridge, app.kubernetes.io/component: frontend }
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: cct-databridge, app.kubernetes.io/component: frontend }
  template:
    metadata:
      labels: { app.kubernetes.io/name: cct-databridge, app.kubernetes.io/component: frontend }
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101         # "nginx" user in nginx:alpine; listens on 8080 so root is not needed
        runAsGroup: 101
        fsGroup: 101           # makes the nginx cache/run emptyDirs writable
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: frontend
          image: cct-databridge-frontend:0.7.0    # overridden by kustomization.yaml "images:"
          imagePullPolicy: IfNotPresent
          ports:
            - { name: http, containerPort: 8080 }
          readinessProbe:
            httpGet: { path: /, port: http }
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet: { path: /, port: http }
            initialDelaySeconds: 5
            periodSeconds: 15
            timeoutSeconds: 3
          resources:
            requests: { cpu: 50m, memory: 32Mi }
            limits: { cpu: 250m, memory: 128Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: nginx-cache, mountPath: /var/cache/nginx }
            - { name: nginx-run, mountPath: /var/run }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - { name: nginx-cache, emptyDir: {} }
        - { name: nginx-run, emptyDir: {} }
        - { name: tmp, emptyDir: {} }
---
apiVersion: v1
kind: Service
metadata:
  name: databridge-frontend
  namespace: cct-databridge
  labels: { app.kubernetes.io/name: cct-databridge, app.kubernetes.io/component: frontend }
spec:
  type: ClusterIP
  selector: { app.kubernetes.io/name: cct-databridge, app.kubernetes.io/component: frontend }
  ports:
    - { name: http, port: 80, targetPort: http }
