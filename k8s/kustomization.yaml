apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: cct-databridge
resources:
  - 00-namespace.yaml
  - 01-pvc.yaml
  - 02-nsr-config.yaml
  - 10-backend.yaml
  - 20-frontend.yaml
  - 30-virtualservice.yaml
  - 40-networkpolicy.yaml
# Point these at your registry and the tag you pushed.
images:
  - name: cct-databridge-backend
    newName: oorudigital/cct-databridge-backend
    newTag: "0.7.0"
  - name: cct-databridge-frontend
    newName: oorudigital/cct-databridge-frontend
    newTag: "0.7.0"
