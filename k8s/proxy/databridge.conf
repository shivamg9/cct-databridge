# Front proxy (host "pritunl", 172.31.7.21, public 13.233.236.183): /etc/nginx/sites-enabled/databridge.conf
# Terminates HTTPS for databridge.openg2p.dpiforall.com and forwards to the Istio ingress gateway's
# HTTP NodePort 32242 on the RKE2 node 172.31.58.104.
server {
    listen 80;
    listen [::]:80;
    server_name databridge.openg2p.dpiforall.com;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name databridge.openg2p.dpiforall.com;

    # Same wildcard certificate as staff-nsr.openg2p.dpiforall.com (copy the exact paths from that file)
    ssl_certificate     /etc/letsencrypt/live/openg2p.dpiforall.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/openg2p.dpiforall.com/privkey.pem;

    # The API accepts one record per request (64 KB limit in the app)
    client_max_body_size 128k;

    location / {
        proxy_pass http://172.31.58.104:32242;
        proxy_http_version 1.1;                  # Istio/Envoy rejects HTTP/1.0 with 426 Upgrade Required
        proxy_set_header Host $host;             # Istio routes by hostname
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";

        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
